name: Docker Build and Push

on:
  push:
    branches: [ "main" ] # Only runs when you push to main

jobs:
  build:
    runs-on: ubuntu-latest # The temporary Linux server
    steps:
      - name: Checkout code
        uses: actions/checkout@v3 # Grabs your code from GitHub

      - name: Log in to Docker Hub
        uses: docker/login-action@v2 # Uses the secrets you saved
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/devops-app:latest