name: Build and Deploy to Azure

on:
  push:
    branches:
      - main  # Triggers only when you merge to main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v2

      - name: 'Login to Docker Hub' # Using Docker Hub since ACR is restricted
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 'Build and push image'
        run: |
          docker build -t your-docker-id/devops-app:${{ github.sha }} .
          docker push your-docker-id/devops-app:${{ github.sha }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'docker-web' # Name from your Azure settings
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: 'your-docker-id/devops-app:${{ github.sha }}'
